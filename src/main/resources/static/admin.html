<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Inbox — Shariq Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/index.html#top" class="logo">Shariq Tech</a>
    <nav class="nav-links">
      <a href="/index.html">Site</a>
      <a href="/blog.html">Blog</a>
    </nav>
  </div>
</header>

<main>
  <section class="admin-page">
    <div class="container container-narrow">
      <div class="section-heading-row">
        <h2>Contact messages</h2>
        <span class="link-arrow" id="message-count"></span>
      </div>
      <div id="submissions">
        <p class="blog-loading">Loading messages&hellip;</p>
      </div>
    </div>
  </section>
</main>

<script>
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatDate(iso) {
  return new Date(iso).toLocaleString('en-US', {
    month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit'
  });
}

async function loadSubmissions() {
  const container = document.getElementById('submissions');
  const count = document.getElementById('message-count');

  try {
    const res = await fetch('/api/admin/submissions');
    if (!res.ok) throw new Error('Request failed with ' + res.status);
    const items = await res.json();

    count.textContent = items.length + (items.length === 1 ? ' message' : ' messages');

    if (!items.length) {
      container.innerHTML = '<p class="blog-empty">No messages yet.</p>';
      return;
    }

    container.innerHTML = '';
    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'message-card';
      card.innerHTML = `
        <div class="message-head">
          <div>
            <div class="message-name">${escapeHtml(item.name)}</div>
            <a class="message-email" href="mailto:${encodeURIComponent(item.email)}">${escapeHtml(item.email)}</a>
          </div>
          <span class="message-date">${formatDate(item.receivedAt)}</span>
        </div>
        <p class="message-body">${escapeHtml(item.message)}</p>
      `;
      container.appendChild(card);
    });
  } catch (e) {
    container.innerHTML = '<p class="blog-empty">Couldn\'t load messages.</p>';
  }
}

loadSubmissions();
</script>
</body>
</html>
