spring.application.name=landing-site

# Railway (and most PaaS providers) inject the PORT env var - Spring Boot picks it up automatically
server.port=${PORT:8080}

# Basic web settings
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# Defaults to throwaway in-memory H2 so the app runs locally with no database.
# Railway overrides these with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD env vars.
spring.datasource.url=jdbc:h2:mem:landing;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Credentials for the /admin.html inbox. ADMIN_PASSWORD has no default on purpose -
# the app refuses to start rather than exposing the inbox with a guessable password.
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD}
