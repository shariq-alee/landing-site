spring.application.name=shariq-tech

# Railway (and most PaaS providers) inject the PORT env var - Spring Boot picks it up automatically
server.port=${PORT:8080}

# Basic web settings
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# Database connection. Railway's Postgres service supplies the PG* variables -
# reference them on the app service as ${{Postgres.PGHOST}} and so on. The
# defaults only exist so the app still starts against a local Postgres.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:postgres}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}

# Flyway owns the schema and applies pending migrations on startup.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hibernate must never alter the schema - it only checks the entities still
# match what Flyway built, so a drift between the two fails fast at startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
